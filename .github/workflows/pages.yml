# Pubblica l'app su GitHub Pages a ogni caricamento sul ramo principale.
# `enablement: true` accende Pages da solo: non serve toccare le impostazioni
# del repository a mano.
name: Pubblica l'app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# una pubblicazione alla volta; se ne arriva un'altra si aspetta la fine
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pubblica:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # si pubblica la cartella così com'è: l'app non ha niente da compilare
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
